apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-rul-deployment
  labels:
    app: fastapi-rul
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fastapi-rul
  template:
    metadata:
      labels:
        app: fastapi-rul
    spec:
      containers:
      - name: fastapi
        image: ahmed93847/sensors_project-fastapi:latest 
        imagePullPolicy: Always
        workingDir: "/app"
        command: ["python", "-m", "uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
        env:
        - name: PYTHONPATH
          value: "/app"
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        - name: REDIS_HOST
          value: "redis-service"
        - name: TRITON_URL
          value: "triton-service:8001"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: fastapi-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fastapi-rul-deployment
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
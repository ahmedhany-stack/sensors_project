global:
  scrape_interval: 2s

scrape_configs:
  - job_name: 'fastapi_rul_app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'
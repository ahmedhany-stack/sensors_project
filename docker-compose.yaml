x-airflow-common:
  &airflow-common
  build: .
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
    PYTHONPATH: "/opt/airflow"
    TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
    TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"
    DB_HOST: "postgres"
    DB_PORT: "5432"
    REDIS_HOST: "redis"
    REDIS_PORT: "6379"
    MLFLOW_TRACKING_URI: "http://host.docker.internal:5000"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./reports:/opt/airflow/reports
  user: "${AIRFLOW_UID:-5000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
      POSTGRES_HOST_AUTH_METHOD: "trust"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: always

  triton:
    image: nvcr.io/nvidia/tritonserver:23.10-py3
    container_name: triton_server
    ports:
      - "9000:8000"
      - "8001:8001"
    volumes:
      - ./models:/models
    command: ["tritonserver", "--model-repository=/models"]
    restart: always

  fastapi:
      build: .
      container_name: fastapi_inference_app
      ports:
        - "8000:8000"
      working_dir: /opt/airflow  # 👈 بنخلي مجلد الشغل الأساسي جوه هو مسار الأيرفلو اللي فيه ملفاتك
      command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --workers 6
      environment:
        - DB_HOST=postgres
        - DB_PORT=5432
        - REDIS_HOST=redis
        - REDIS_PORT=6379
        - TRITON_URL=triton:8001
        - PYTHONPATH=/opt/airflow  # 👈 بنعرف بايثون إن المجلد الأساسي هو اللي فيه الـ src
      volumes:
        - .:/opt/airflow  # 👈 بيربط مشروعك المحلي كله جوه الكونتينر
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
        triton:
          condition: service_started
      entrypoint: ""
      restart: always
      env_file:
        - .env

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /sources/logs /sources/dags /sources/plugins /sources/src
        chown -R "${AIRFLOW_UID:-5000}:0" /sources/{logs,dags,plugins,src}
        airflow db init
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email admin@example.com || true
    environment:
      <<: *airflow-common-env
    user: "0:0"
    volumes:
      - .:/sources
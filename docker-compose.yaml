services:
  postgres:
    image: postgres:15
    container_name: postgres_rul
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Ataazee66}
      POSTGRES_DB: ${POSTGRES_DB:-rul_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # السطر ده هو اللي بيكريت الجداول تلقائياً أول ما الدوكر يقوم
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  webserver:
    build: .
    container_name: airflow_webserver
    restart: always
    depends_on:
      - postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-Ataazee66}@postgres:5432/${POSTGRES_DB:-rul_db}
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-Ataazee66}@postgres:5432/${POSTGRES_DB:-rul_db}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-Ataazee66}@postgres:5432/${POSTGRES_DB:-rul_db}
      - AIRFLOW__WEBSERVER__SECRET_KEY=my_custom_secret_key_12345
      - PYTHONPATH=/opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./reports:/opt/airflow/reports
      - ./data:/opt/airflow/data
      - ./src:/opt/airflow/src
    ports:
      - "8080:8080"
    command: bash -c "airflow db migrate && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin || true && airflow webserver"

  scheduler:
    build: .
    container_name: airflow_scheduler
    restart: always
    depends_on:
      - webserver
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-Ataazee66}@postgres:5432/${POSTGRES_DB:-rul_db}
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-Ataazee66}@postgres:5432/${POSTGRES_DB:-rul_db}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-Ataazee66}@postgres:5432/${POSTGRES_DB:-rul_db}
      - AIRFLOW__WEBSERVER__SECRET_KEY=my_custom_secret_key_12345
      - PYTHONPATH=/opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./reports:/opt/airflow/reports
      - ./data:/opt/airflow/data
      - ./src:/opt/airflow/src
    command: bash -c "airflow db migrate && airflow scheduler"

volumes:
  postgres_data:
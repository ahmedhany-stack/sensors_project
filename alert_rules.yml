groups:
  - name: rul_api_alerts
    rules:
      - alert: HighPredictionLatency
        expr: rate(model_prediction_latency_seconds_sum[1m]) > 1.0
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "High Prediction Latency Detected!"
          description: "API prediction latency is exceeding 1 second."